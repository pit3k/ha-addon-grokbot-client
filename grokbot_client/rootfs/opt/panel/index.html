<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok Bot client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Grok Bot client</h1>
    <p id="status" role="status">Starting</p>
    <p id="account" hidden></p>
    <div id="signin-block" hidden>
      <a id="signin-link" class="button" target="_blank" rel="noopener noreferrer">Open sign-in page</a>
      <img id="qr" alt="Sign-in QR code" width="200" height="200" hidden>
      <input id="login-url" type="url" readonly spellcheck="false">
    </div>
    <div class="actions">
      <button id="signin-start" class="button" type="button" hidden>Sign in</button>
      <button id="signout" class="button" type="button" hidden>Sign out</button>
    </div>
    <p id="detail" hidden></p>
    <p id="error" role="alert" hidden></p>
    <p id="version"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
