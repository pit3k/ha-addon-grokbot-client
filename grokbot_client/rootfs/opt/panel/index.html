<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok Bot client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p id="status" role="status">Starting</p>
    <fieldset id="permission">
      <legend>Execution policy</legend>
      <label><input type="radio" name="permission" value="always" checked> Always allow</label>
      <label><input type="radio" name="permission" value="ask"> Ask every time</label>
      <label><input type="radio" name="permission" value="never"> Never allow</label>
      <p>This applies only to this sign-in. Change it later in Grok Bot under Settings → Computer. Restarting the app keeps that setting. Sign out and sign in again to pick again.</p>
    </fieldset>
    <p id="account" hidden></p>
    <img id="qr" alt="Sign-in QR code" width="200" height="200" hidden>
    <a id="signin-link" class="button" hidden target="_blank" rel="noopener noreferrer">Click to sign in</a>
    <div id="link-row" hidden>
      <input id="login-url" type="text" readonly spellcheck="false">
      <button id="copy" type="button" aria-label="Copy">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="5" y="1" width="9" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <rect x="2" y="4" width="9" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
    </div>
    <button id="signout" type="button" hidden>Sign out</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
