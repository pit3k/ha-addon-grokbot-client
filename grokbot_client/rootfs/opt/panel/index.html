<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok Bot client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p id="status" role="status">Starting</p>
    <p id="account" hidden></p>
    <img id="qr" alt="Sign-in QR code" width="200" height="200" hidden>
    <a id="signin-link" class="button" hidden target="_blank" rel="noopener noreferrer">Click to sign in</a>
    <input id="login-url" type="text" readonly spellcheck="false" hidden>
    <button id="copy" type="button" hidden>Copy</button>
    <button id="signout" type="button" hidden>Sign out</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
