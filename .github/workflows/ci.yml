name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: App config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the app configuration
        uses: frenck/action-addon-linter@v2.21.2
        with:
          path: ./grokbot_client

  shell:
    name: ShellCheck and script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq busybox
      - name: Run tests
        run: tests/run-all.sh

  build:
    name: Image ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [lint, shell]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the app version
        id: version
        run: |
          version=$(awk '/^version:/{gsub(/"/,"",$2); print $2; exit}' grokbot_client/config.yaml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          test -n "$version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Decide whether to publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "image=ghcr.io/pit3k/${ARCH}-addon-grokbot-client" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "push" && "$REF" == "refs/heads/main" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for the smoke test
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v6
        with:
          context: grokbot_client
          file: grokbot_client/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: false
          load: true
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: grokbot-client:test

      - name: Smoke test the panel and a missing login
        if: matrix.arch == 'amd64'
        run: GROKBOT_IMAGE=grokbot-client:test tests/smoke.sh

      - name: Build this architecture
        if: matrix.arch != 'amd64' || steps.publish.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: grokbot_client
          file: grokbot_client/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          push: ${{ steps.publish.outputs.push == 'true' }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.publish.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.publish.outputs.image }}:latest
