name: Bug report
description: Something does not work as expected
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The version shown on the app's Info page, for example 0.1.0.
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Paste only the relevant lines. Remove tokens, passwords, and other secrets first.
